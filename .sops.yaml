# sops の暗号化受信者定義。
#
# 各マシンは自分の *ユーザ* SSH 鍵 (~/.ssh/id_ed25519) を age に変換した公開鍵で
# 復号する。home-manager 起動時の自動復号にも、secret の手動編集にも同じ鍵を使う
# （sops CLI は ~/.ssh/id_ed25519 を自動検出する）。専用の編集鍵は不要。
#
# 公開鍵の求め方:
#   nix shell nixpkgs#ssh-to-age -c sh -c 'ssh-to-age < ~/.ssh/id_ed25519.pub'
#
# マシンを追加/廃棄したら受信者を編集し、必ず以下で再暗号化すること:
#   sops updatekeys secrets/rclone.yaml
#
# この secret は vault ワークフロー(添付同期・papis 同期)専用。復号は同期スクリプト自身
# (nix/with-rclone-secret.nix)が実行時に行う。復号鍵は各マシンの SSH 鍵(または持ち込みの
# age 鍵)で、この repo には公開鍵(受信者)しか載らない。
keys:
  - &host_desktop age1hx7qvk9csz5dd6hp2q9gqzzjw6e8hetsxrtndy303ssela6rnvfsdqdekp
  - &host_spin713 age1przpuzzfm8dfwgcmh34uahwshdyph7583lc6p7jt5n9sp36tkvtszwuvez
  # macOS を追加したらここに &host_macbook を足して sops updatekeys する
creation_rules:
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *host_desktop
          - *host_spin713
